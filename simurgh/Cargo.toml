# soil.workspace = true
# shah.workspace = true
serde.workspace = true
serde_json.workspace = true
# rstar.workspace = true
log.workspace = true
utoipa.workspace = true
nest.workspace = true
tokio.workspace = true
rand.workspace = true

media = { path = "../media" }


chrono = "0.4"
cercis = "1.2"
actix-web = "4"
actix-utils = "3"
# actix-web-httpauth = "0.8.2"
actix-files = "0.7"
actix-multipart = "0.8"

toml = "0.9.10"

[dependencies.sqlx]
version = "0.8"
features = ["sqlite", "runtime-tokio", "chrono"]

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["rustls", "charset", "http2", "json", "gzip"]

