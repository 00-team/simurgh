[workspace]
members = ["simurgh", "media", "nest"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
log = "0.4"
rand = "0.10"
potk = "1.2"
nest = { path = "./nest" }


# color-backtrace = "0.7"
# backtrace = "0.3"
# cercis = "1.2"
# image = "0.25"
# webp = "0.3.0"
# # tempfile = "3.13.0"
# # hex = "0.4.3"
# # lazy_static = "1.5.0"
# # awc = { version = "3.5.1", features = ["openssl"] }
utoipa = { version = "6.0.0", features = ["actix_extras", "indexmap"] }

# dotenvy = "0.15.7"
# pretty_env_logger = "0.5.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# serde_tuple = "1.0.0"
serde_json = "1"
# chrono = { version = "0.4.38", features = ["serde"] }
# sqlx-cli = { version = "0.8.2", features = ["sqlite", "completions"] }


[workspace.lints.clippy]
needless_return_with_question_mark = "allow"
enum_variant_names = "allow"
